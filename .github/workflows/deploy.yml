name: Deploy
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full Artifact Registry image URL (region-docker.pkg.dev/project/repo:tag)'
        required: true
      service:
        description: 'Cloud Run service name'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 'gcp-cicd'
    permissions:
      id-token: write
      contents: read

    env:
      REGION: asia-southeast1

    steps:
      - uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Auth to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying service: ${{ github.event.inputs.service }}"
          echo "Using image: ${{ github.event.inputs.image }}"

          gcloud run deploy ${{ github.event.inputs.service }} \
            --image ${{ github.event.inputs.image }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated

      - name: 🔔 Notify Discord (Deploy Status)
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          color: ${{ job.status == 'success' && '0x57F287' || '0xED4245' }}

          content: |
            🚀 **Deploy Notification**
            <@&888117099246026772>

            **Repository:** `${{ github.event.repository.name }}`
            **Environment:** `${{ env.APP_ENV }}`
            **Triggered by:** `${{ github.actor }}`

          title: '📦 Deploy: ${{ github.event.repository.name }} → ${{ env.APP_ENV }}'

          description: |
            **🟢 Status**
            `${{ job.status }}`

            **🔖 Version**
            `${{ env.APP_VERSION }}`

            **🗄 Migration**
            `${{ env.RUN_MIGRATION }}`

            **🌿 Branch**
            `${{ github.ref_name }}`

            **🧾 Commit**
            [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            **⏱ Deployed at**
            `${{ github.run_started_at }}`

          url: '${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}'
