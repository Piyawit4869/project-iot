name: Deploy to Cloud Run

on:
  workflow_run:
    workflows:
      - Build Checked
    types:
      - completed
    branches:
      - develop
      - demo
      - staging
      - main

  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        default: "develop"
      version:
        description: "Version (branch or tag)"
        required: true
        default: "develop"

jobs:
  deploy:
    name: 🚀 Deploy to Cloud Run (${{ github.event_name == 'workflow_dispatch' && inputs.env || github.event.workflow_run.head_branch }})
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: 🧪 Set environment variables
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "APP_ENV=${{ inputs.env }}" >> $GITHUB_ENV
            echo "APP_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            BRANCH=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }} \
              | jq -r .head_branch)
            echo "APP_ENV=$BRANCH" >> $GITHUB_ENV
            echo "APP_VERSION=$BRANCH" >> $GITHUB_ENV
          fi

      - name: 📥 Checkout code from correct branch
        uses: actions/checkout@v3
        with:
          ref: ${{ env.APP_VERSION }}

      - name: 🔐 Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 🧾 Debug environment
        run: |
          echo "Branch (APP_ENV): $APP_ENV"
          echo "Version: $APP_VERSION"
          echo "Triggered by: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"

      - name: 🚀 Deploying ${{ github.repository }} to Cloud Run (${{ env.APP_ENV }})
        env:
          APP_IMAGE: ${{ secrets.GCP_IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ github.event.repository.name }}-${{ env.APP_ENV }}
          SERVICE_NAME: ${{ github.event.repository.name }}-${{ env.APP_ENV }}
          APP_VERSION: ${{ env.APP_VERSION }}
          GCP_CLOUD_RUN_REGION: ${{ secrets.GCP_CLOUD_RUN_REGION }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          echo "Deploying $SERVICE_NAME with image $APP_IMAGE:$APP_VERSION..."
          gcloud run deploy $SERVICE_NAME \
            --region=$GCP_CLOUD_RUN_REGION \
            --image $APP_IMAGE:$APP_VERSION \
            --project $GCP_PROJECT_ID \
            --platform=managed \
            --quiet \
            --allow-unauthenticated

      - name: 🔔 Notify Discord
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          content: |
            <@&888117099246026772> ✅ Deploy Alert!
            Repo: ${{ github.event.repository.name }}
            Branch: ${{ env.APP_ENV }}
            Triggered by: ${{ github.actor }}
          title: "Deploy: `${{ github.event.repository.name }}` → `${{ env.APP_ENV }}`"
          description: |
            Status: `${{ job.status }}`
            Version: `${{ env.APP_VERSION }}`
          url: "https://github.com/${{ github.repository }}/tree/${{ env.APP_VERSION }}"
