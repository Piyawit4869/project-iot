name: Build

on:
  push:
    branches:
      - develop
      - release

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (only main and uat allowed)'
        required: true
        default: 'uat'
        type: choice
        options:
          - uat
          - main

      version:
        description: 'Version tag to build (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
        type: string

      environment:
        description: 'Environment to deploy (dev, uat, prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - uat
          - prod

jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v2
        with:
          node-version: '22.20'

      - name: Install dependencies
        run: yarn install

      - name: Build and Lint
        run: |
          yarn build && yarn lint

      # running this later when got jest test
      # - name: Run tests
      #   run: yarn test

      - name: Notify Discord (Code Check)
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: 'Code check by ${{ github.actor }}'
          description: 'Code check ${{ job.status }} please check in github before pull request'
          url: '${{ github.server_url }}/${{ github.repository }}'

  build:
    runs-on: ubuntu-latest
    if: contains('refs/heads/main refs/heads/uat refs/heads/develop', github.ref)
    environment: 'gcp-cicd'
    permissions:
      id-token: write
      contents: read
      actions: write
    env:
      GAR_REGION: asia-southeast1
      REGION: asia-southeast1

    steps:
      - uses: actions/checkout@v4

      - name: Extract repo name
        run: echo "REPO=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Extract service name
        run: echo "SERVICE_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_ENV

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Auth to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker $GAR_REGION-docker.pkg.dev --quiet

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ] && [ "${{ github.event.inputs.branch }}" != "develop" ]; then
            BRANCH=${{ github.event.inputs.branch }}

            if [ "$BRANCH" = "uat" ]; then
              echo "VERSION=${{ github.event.inputs.version }}-rc" >> $GITHUB_OUTPUT
            else
              echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "VERSION=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build & push image
        id: build
        env:
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
          APP_IMAGE: ${{ env.GAR_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-docker-images/${{ env.REPO }}
        run: |
          echo "🔧 Building image..."
          echo "APP_VERSION: $APP_VERSION"
          echo "APP_IMAGE: $APP_IMAGE"
          docker build -t "$APP_IMAGE:$APP_VERSION" .

          echo "🚀 Pushing image..."
          docker push "$APP_IMAGE:$APP_VERSION"

          echo "image=$APP_IMAGE:$APP_VERSION" >> $GITHUB_OUTPUT

      - name: Invoke Deploy workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: deploy.yml
          ref: ${{ github.ref }}
          inputs: |
            {
              "image": "${{ steps.build.outputs.image }}",
              "service": "${{ env.REPO }}-${{ github.event.inputs.environment || 'dev' }}"
            }

      - name: 🔔 Notify Discord (Build)
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: 'Build by ${{ github.actor }}'
          description: 'Packed prepared to deploy'
          url: '${{ github.server_url }}/${{ github.repository }}'
