name: Deploy
on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full Artifact Registry image URL (region-docker.pkg.dev/project/repo:tag)'
        required: true
      service:
        description: 'Cloud Run service name'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 'gcp-cicd'
    permissions:
      id-token: write
      contents: read

    env:
      REGION: asia-southeast1

    steps:
      - uses: actions/checkout@v4

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      - name: Auth to GCP via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - name: Deploy to Cloud Run
        run: |
          echo "Deploying service: ${{ github.event.inputs.service }}"
          echo "Using image: ${{ github.event.inputs.image }}"

          gcloud run deploy ${{ github.event.inputs.service }} \
            --image ${{ github.event.inputs.image }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated