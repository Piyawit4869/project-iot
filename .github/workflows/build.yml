name: Build Checked

on:
  push:
    branches:
      - "**"

jobs:
  code-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "22.12.0"

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm build

      - name: Run lint
        run: pnpm lint

      # running this later when got jest test
      # - name: Run tests
      #   run: yarn test

      - name: Notify Discord (Code Check)
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Code check by ${{ github.actor }}"
          description: "build ${{ job.status }} please check in github before pull request"
          url: "https://github.com/Utotech-organize/rome-backoffice"

  build:
    needs: code-check
    runs-on: ubuntu-latest
    if: contains('refs/heads/develop refs/heads/main refs/heads/staging', github.ref)
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v0.4.0
        with:
          workload_identity_provider: ${{ secrets.GCP_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get the version
        id: get_version
        run: echo ::set-output name=VERSION::$(echo $GITHUB_REF | cut -d / -f 3)

      - name: Build Docker Image
        env:
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
          APP_IMAGE: ${{ secrets.GCP_IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ github.event.repository.name }}
        run: docker build -t ${{ env.APP_IMAGE }}:${{ env.APP_VERSION }} .

      - name: Configure Docker Client
        run: |-
          gcloud auth configure-docker --quiet
          gcloud auth configure-docker ${{ secrets.GCP_IMAGE_REGISTRY }} --quiet

      - name: Push Docker Image to Artifact Registry
        env:
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
          APP_IMAGE: ${{ secrets.GCP_IMAGE_REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/${{ github.event.repository.name }}
        run: |-
          docker push ${{ env.APP_IMAGE }}:${{ env.APP_VERSION }}

      - name: Notify Discord (Build)
        uses: sarisia/actions-status-discord@v1
        if: always()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Build by ${{ github.actor }}"
          description: "Build container prepared to deploy artifact"
          url: "https://github.com/Utotech-organize/rome-backoffice"
